<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 Conversor SVG a HTML/React</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .drop-zone {
            border: 3px dashed #667eea;
            border-radius: 12px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #f8f9ff;
            margin-bottom: 20px;
        }

        .drop-zone:hover {
            border-color: #764ba2;
            background-color: #f0f0ff;
        }

        .drop-zone.dragover {
            border-color: #764ba2;
            background-color: #e8e8ff;
            box-shadow: 0 0 0 8px rgba(118, 75, 162, 0.1);
        }

        .drop-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .drop-text {
            font-size: 16px;
            color: #333;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .drop-subtext {
            font-size: 13px;
            color: #999;
        }

        #fileInput {
            display: none;
        }

        button {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            display: none;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }

        .result.show {
            display: block;
        }

        .result h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .tab-btn {
            padding: 10px 15px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            font-weight: 500;
            color: #999;
            transition: all 0.3s;
            width: auto;
            font-size: 14px;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .code-box {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.4;
            color: #333;
            border: 1px solid #ddd;
            word-break: break-all;
            white-space: pre-wrap;
        }

        .copy-btn {
            background: #667eea;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .copy-btn:hover {
            background: #764ba2;
        }

        .preview-box {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .preview-box svg {
            max-width: 100%;
            height: auto;
        }

        .message {
            display: none;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
        }

        .message.success {
            display: block;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .message.error {
            display: block;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .loader {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .loader.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Conversor SVG</h1>
        <p class="subtitle">Convierte tus diseños SVG de Illustrator a HTML/React</p>

        <div id="successMsg" class="message success"></div>
        <div id="errorMsg" class="message error"></div>

        <div class="drop-zone" id="dropZone">
            <div class="drop-icon">📁</div>
            <div class="drop-text">Arrastra tu archivo SVG aquí</div>
            <div class="drop-subtext">o haz click para seleccionar</div>
        </div>

        <input type="file" id="fileInput" accept=".svg" />
        <button onclick="selectFile()">📂 Seleccionar archivo</button>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>Convirtiendo...</p>
        </div>

        <div class="result" id="result">
            <h2>📋 Resultado</h2>

            <div class="tabs">
                <button class="tab-btn active" onclick="openTab(event, 'html')">HTML</button>
                <button class="tab-btn" onclick="openTab(event, 'react')">React</button>
                <button class="tab-btn" onclick="openTab(event, 'preview')">Vista Previa</button>
            </div>

            <div id="html" class="tab-content active">
                <div class="code-box" id="htmlCode"></div>
                <button class="copy-btn" onclick="copyCode('htmlCode')">📋 Copiar HTML</button>
            </div>

            <div id="react" class="tab-content">
                <div class="code-box" id="reactCode"></div>
                <button class="copy-btn" onclick="copyCode('reactCode')">📋 Copiar React</button>
            </div>

            <div id="preview" class="tab-content">
                <div class="preview-box" id="previewBox"></div>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const result = document.getElementById('result');
        const loader = document.getElementById('loader');
        const successMsg = document.getElementById('successMsg');
        const errorMsg = document.getElementById('errorMsg');

        // Drag & drop
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files[0]) {
                procesarArchivo(e.dataTransfer.files[0]);
            }
        });

        dropZone.addEventListener('click', selectFile);

        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                procesarArchivo(e.target.files[0]);
            }
        });

        function selectFile() {
            fileInput.click();
        }

        function procesarArchivo(archivo) {
            if (!archivo.name.endsWith('.svg')) {
                mostrarError('Por favor selecciona un archivo .svg');
                return;
            }

            mostrarMensaje(false);
            loader.classList.add('show');

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const svg = e.target.result;
                    convertir(svg, archivo.name);
                } catch (err) {
                    mostrarError('Error: ' + err.message);
                }
            };
            reader.onerror = function() {
                mostrarError('Error al leer el archivo');
            };
            reader.readAsText(archivo);
        }

        function convertir(svg, nombre) {
            try {
                // Nombre del componente
                const comp = nombre.replace('.svg', '')
                    .split('-')
                    .map(w => w.charAt(0).toUpperCase() + w.slice(1))
                    .join('');

                // Limpiar SVG
                let clean = svg
                    .replace(/xmlns="[^"]*"/g, '')
                    .replace(/xmlns:xlink="[^"]*"/g, '')
                    .replace(/<\?xml[^?]*\?>/g, '')
                    .trim();

                // ViewBox
                const match = svg.match(/viewBox="([^"]*)"/);
                const viewBox = match ? match[1] : '0 0 100 100';

                // HTML
                const html = `<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${comp}</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 1200px;
        }
        svg { width: 100%; height: auto; }
    </style>
</head>
<body>
    <div class="container">
        ${clean}
    </div>
</body>
</html>`;

                // React
                const react = `'use client';

import React from 'react';

export const ${comp} = React.forwardRef((props, ref) => (
    <svg
        ref={ref}
        viewBox="${viewBox}"
        {...props}
    >
        ${clean.split('\n').slice(1).join('\n        ')}
    </svg>
));

${comp}.displayName = '${comp}';
export default ${comp};`;

                // Mostrar
                document.getElementById('htmlCode').textContent = html;
                document.getElementById('reactCode').textContent = react;
                document.getElementById('previewBox').innerHTML = clean;

                result.classList.add('show');
                loader.classList.remove('show');
                mostrarExito('¡SVG convertido correctamente!');

            } catch (err) {
                mostrarError('Error: ' + err.message);
                loader.classList.remove('show');
            }
        }

        function openTab(evt, tabName) {
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(el => el.classList.remove('active'));

            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach(el => el.classList.remove('active'));

            document.getElementById(tabName).classList.add('active');
            evt.currentTarget.classList.add('active');
        }

        function copyCode(elementId) {
            const text = document.getElementById(elementId).textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                const original = btn.textContent;
                btn.textContent = '✅ ¡Copiado!';
                setTimeout(() => { btn.textContent = original; }, 2000);
            });
        }

        function mostrarExito(msg) {
            successMsg.textContent = '✅ ' + msg;
            successMsg.style.display = 'block';
            errorMsg.style.display = 'none';
            setTimeout(() => { successMsg.style.display = 'none'; }, 4000);
        }

        function mostrarError(msg) {
            errorMsg.textContent = '❌ ' + msg;
            errorMsg.style.display = 'block';
            successMsg.style.display = 'none';
        }

        function mostrarMensaje(mostrar) {
            if (!mostrar) {
                successMsg.style.display = 'none';
                errorMsg.style.display = 'none';
            }
        }
    </script>
</body>
</html>
